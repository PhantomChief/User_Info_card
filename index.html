<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Info Card</title>
    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main container -->
    <div class="container">
      <!-- Title -->
      <h1>User Info Card</h1>
      <p class="subtitle">Fill in your information</p>
      <!-- INPUT CARD -->
      <div class="card">
        <form id="userForm">
          <!-- Full Name -->
          <div class="form-row">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
            />
          </div>
          <!-- Email -->
          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" />
          </div>

          <!-- Phone -->
          <div class="form-row">
            <label for="phone">Phone</label>
            <input
              type="tel"
              id="phone"
              placeholder="Enter your phone number"
            />
          </div>
          <!-- Address -->
          <div class="form-row">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter your address" />
          </div>
          <!-- Age and Birthday -->
          <div class="two-column">
            <div class="form-row">
              <label for="age">Age</label>
              <input type="number" id="age" placeholder="Age" />
            </div>
            <div class="form-row">
              <label for="birthday">Birthday</label>
              <input type="date" id="birthday" />
            </div>
          </div>
          <!-- Course and Hobby -->
          <div class="two-column">
            <div class="form-row">
              <label for="course">Course</label>
              <input type="text" id="course" placeholder="Enter your course" />
            </div>
            <div class="form-row">
              <label for="hobby">Hobby</label>
              <input type="text" id="hobby" placeholder="Enter your hobby" />
            </div>
          </div>
          <!-- Favorite Color -->
          <div class="form-row">
            <label for="favoriteColor">Favorite Color</label>
            <select id="favoriteColor">
              <option value="">Select a color</option>
              <option value="Red">Red</option>
              <option value="Blue">Blue</option>
              <option value="Green">Green</option>
              <option value="Yellow">Yellow</option>
              <option value="Purple">Purple</option>
            </select>
          </div>
          <!-- Gender -->
          <div class="form-row gender-row">
            <label>Gender</label>
            <div class="gender-options">
              <label>
                <input type="radio" name="gender" value="Male" /> Male
              </label>
              <label>
                <input type="radio" name="gender" value="Female" /> Female
              </label>
              <label>
                <input type="radio" name="gender" value="Other" /> Other
              </label>
            </div>
          </div>
          <!-- Button -->
          <button type="button" id="showInfo">SHOW MY INFO</button>
        </form>
      </div>
      <!-- OUTPUT CARD -->
      <div class="card output-card">
        <h2>MY INFORMATION</h2>
        <div id="output">
          <p class="empty-message">Your information will appear here.</p>
        </div>
      </div>
    </div>
    <!-- Connect JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
